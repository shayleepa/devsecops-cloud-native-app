name: DevSecOps CI/CD Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  
jobs:
# Stage 1: Code quality and static application security testing (SAST) 
  sast-and-lint:
    name: "SAST & Code Security"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: |
          cd app
          npm install

      - name: Security Audit Dependencies
        run: |
          cd app
          npm audit --audit-level=high || true

# Stage 2: Container Security and Vulnerability scanning container-security
  container-security:
    name: "Docker Build and Trivy CVE Scan"
    runs-on: ubuntu-latest
    needs: sast-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t devsecops-web-app:${{ github.sha }} ./app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-web-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0' #Set to '1' in strict production environments to fail the build on critical vulnerabilities
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

# Stage 3: Infrastructure and Kubernetes Security validation 
  k8s-security-scan:
    name: "Kubernetes Manifest Security Check"
    runs-on: ubuntu-latest
    needs:  container-security
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes YAML Syntax
        run: |
          python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('k8s/*.yaml')]"
          echo "All Kubernetes manifests parsed successfully!"